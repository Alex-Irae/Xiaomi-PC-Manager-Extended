<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'"><title>Search settings</title><link rel="stylesheet" href="compact.css"></head><body class="settings"><h1>Search settings</h1><p>A small local index. Your files stay on this computer.</p><form id="settings-form">
<label for="roots">Search folders · one path per line</label><textarea id="roots" spellcheck="false"></textarea><button id="add-root" type="button" class="secondary">Choose folder</button>
<label for="excluded_folders">Excluded folders · no scanning or results</label><textarea id="excluded_folders" spellcheck="false" placeholder="C:\Private\Archive"></textarea><button id="add-exclusion" type="button" class="secondary">Exclude a folder</button>
<label for="excluded_extensions">Excluded file types · names and contents</label><input id="excluded_extensions" type="text" placeholder=".pdf, .zip, .log">
<label for="name_only_extensions" title="These files are found by their name and path. Their contents are not read, which keeps the index small.">Name-only file types · found by filename, contents not read</label><input id="name_only_extensions" type="text" placeholder=".py, .js, .html">
<div class="row"><div><label for="preferred_device">Preferred hardware</label><select id="preferred_device"><option value="auto">Auto</option><option value="cpu">CPU</option><option value="gpu">GPU, then CPU</option><option value="npu">NPU, then CPU</option></select></div><div><label for="shortcut">Open search</label><select id="shortcut"><option value="none">Direct launch only</option><option value="double_ctrl">Ctrl then Ctrl</option><option value="alt_space">Alt + Space</option></select></div></div>
<div class="row"><div><label for="indexing_mode">Indexing</label><select id="indexing_mode"><option value="battery_saver">Save battery</option><option value="normal">Normal</option><option value="paused">Paused</option></select></div><div><label for="semantic_enabled">Meaning search</label><select id="semantic_enabled"><option value="true">Enabled</option><option value="false">Names + contents only</option></select></div></div>
<details><summary>Appearance</summary><div class="row"><div><label for="accent_color">Accent</label><input id="accent_color" type="color"></div><div><label for="font_family">Font</label><select id="font_family"><option>Segoe UI</option><option>MiSans</option><option>Arial</option></select></div></div><div class="row"><div><label for="bar_size">Result size</label><select id="bar_size"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></div><div><label for="arrow_style">Search arrow</label><select id="arrow_style"><option value="arrow">Arrow</option><option value="chevron">Chevron</option></select></div></div></details>
<div class="actions"><button class="primary" type="submit">Save</button><button id="scan" type="button" class="secondary">Rescan</button><button id="quit" type="button" class="secondary">Quit app</button></div><div id="message" role="status"></div><div id="status"></div></form><script src="bridge.js"></script><script src="settings.js"></script></body></html>
