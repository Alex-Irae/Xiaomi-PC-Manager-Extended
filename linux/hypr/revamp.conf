# Purpose: Hyprland settings for the Xiaomi Revamp apps on Linux: start them in the background and bind their keys.
# Usage: add one line to ~/.config/hypr/hyprland.conf (Caelestia: ~/.config/hypr/hyprland/custom.conf or your
#        user config):   source = /path/to/Xiaomi-Revamp/linux/hypr/revamp.conf
#        The revamp-* commands are created by linux/install.sh in ~/.local/bin.
# Wayland has no global shortcuts owned by apps: the compositor owns the keys and starts a command. Each command
# reaches the already running app. Change the keys freely; these avoid Caelestia's defaults as far as I know them.

exec-once = revamp-pc-manager --tray
exec-once = revamp-ai-center --tray
# The translator loads its models at start (about 1 GB of memory). Remove this line to load them on first use.
exec-once = revamp-translator --tray

# PC Manager: quick panel and manager window
bind = SUPER, M, exec, revamp-pc-manager --toggle
bind = SUPER SHIFT, M, exec, revamp-pc-manager --manager

# File search. Windows uses a double tap of Ctrl, which a compositor binding cannot express.
bind = ALT, SPACE, exec, revamp-ai-center --search
bind = SUPER SHIFT, F, exec, revamp-ai-center --center

# Screen Translator: whole monitor, or an area
bind = CTRL ALT, F, exec, revamp-translator --screen
bind = CTRL ALT, T, exec, revamp-translator --region

# The overlay must not be dimmed, blurred or animated like a normal window.
layerrule = noanim, revamp-translator
layerrule = noanim, revamp-search
layerrule = blur, revamp-quick
layerrule = ignorezero, revamp-quick
